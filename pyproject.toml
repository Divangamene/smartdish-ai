[project]
name = "smartdish"
version = "0.1.0"
description = "SmartDish AI - projeto de Deep Learning com CNNs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # --- Deep Learning: PyTorch (CPU) ---
    "torch>=2.5",
    "torchvision>=0.20",
    "torchaudio>=2.5",
    "torchmetrics>=1.4",
    "lightning>=2.4",
    "timm>=1.0",
    "torchinfo>=1.8",
    # --- Deep Learning: TensorFlow / Keras ---
    "tensorflow>=2.18",
    "keras>=3.6",
    # --- Dados e ciência ---
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "scikit-image",
    # --- Imagem e augmentation ---
    "pillow",
    "opencv-python",
    "albumentations",
    # --- Visualização ---
    "matplotlib",
    "seaborn",
    "plotly",
    # --- Experiências e monitorização ---
    "tensorboard",
    "tqdm",
    "pyyaml",
    "python-dotenv",
    # --- Modelos pré-treinados / datasets ---
    "huggingface-hub",
    "datasets",
    # --- Exportação / deployment ---
    "onnx",
    "onnxruntime",
    "gradio",
]

[dependency-groups]
dev = [
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "pytest",
    "ruff",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smartdish"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
